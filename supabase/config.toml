project_id = "rapidohelp"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth",
  "http://localhost:3000/dashboard",
  "http://localhost:3000/worker",
  "io.supabase.flutter://signin-callback/",
  "rapidohelp://auth"
]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
host = "env(SMTP_HOST)"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "RapidoHelp Helpdesk"

[auth.email.template.magic_link]
subject = "Your RapidoHelp sign-in code"
content_path = "./supabase/templates/magic_link.html"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"
